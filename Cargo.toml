[workspace]
members = [
    "crates/pride-scp-core",
    "crates/pride-scp-index",
    "crates/pride-scp-discovery",
    "crates/pride-scp-sdrf",
    "crates/pride-scp-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
csv = "1.3"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
